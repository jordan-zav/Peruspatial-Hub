name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint plugin, scripts and tests
        run: python -m ruff check *.py scripts tests

      - name: Run tests
        run: python -B -m pytest

      - name: Build QGIS plugin archive
        run: python scripts/package_plugin.py

      - name: Scan the installable plugin archive with Bandit
        run: |
          python -m zipfile -e dist/PeruSpatial-Hub-*.zip packaged-security
          python -m bandit -r packaged-security/peruspatial_hub --format json --output bandit-plugin.json

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: peruspatial-hub
          path: |
            dist/PeruSpatial-Hub-*.zip
            bandit-plugin.json

  qgis-interface:
    needs: test-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QGIS_PREFIX_PATH: /usr
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system QGIS and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qgis python3-qgis xvfb xauth

      - name: Download the tested installable archive
        uses: actions/download-artifact@v4
        with:
          name: peruspatial-hub
          path: qa-package

      - name: Extract the installable archive
        run: python3 -m zipfile -e qa-package/dist/PeruSpatial-Hub-*.zip qa-installed

      - name: Exercise real Qt widgets and background tasks
        run: xvfb-run -a /usr/bin/python3 scripts/qgis_ui_checks.py --plugin-root qa-installed/peruspatial_hub --output qa-output/widgets

      - name: Install and exercise plugin inside QGIS desktop
        run: xvfb-run -a /usr/bin/python3 scripts/qgis_desktop_checks.py --qgis-bin /usr/bin/qgis --qt-platform xcb --plugin-root qa-installed/peruspatial_hub --install --output qa-output/desktop

      - name: Validate inventoried CRS metadata with QGIS
        run: xvfb-run -a /usr/bin/python3 scripts/qgis_inventory_checks.py --catalog qa-installed/peruspatial_hub/catalog/catalog.json --output qa-output/inventory > qa-output/inventory-console.log 2>&1

      - name: Upload interface reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-interface-audit
          path: qa-output
